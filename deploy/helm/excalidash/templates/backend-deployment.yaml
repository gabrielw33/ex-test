apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "excalidash.fullname" . }}-backend
  labels:
    {{- include "excalidash.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "excalidash.componentLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "excalidash.componentLabels" (dict "root" . "component" "backend") | nindent 8 }}
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "excalidash.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8000"
            - name: DATABASE_PROVIDER
              value: sqlite
            - name: DATABASE_URL
              value: file:/app/prisma/dev.db
            - name: AUTH_MODE
              value: {{ .Values.backend.authMode | quote }}
            - name: TRUST_PROXY
              value: {{ .Values.backend.trustProxy | quote }}
            - name: ENFORCE_HTTPS_REDIRECT
              value: {{ .Values.backend.enforceHttpsRedirect | quote }}
            - name: RUN_MIGRATIONS
              value: {{ .Values.backend.runMigrations | quote }}
            - name: MIGRATION_LOCK_TIMEOUT_SECONDS
              value: {{ .Values.backend.migrationLockTimeoutSeconds | quote }}
            - name: UPLOAD_MAX_MB
              value: {{ .Values.backend.uploadMaxMb | quote }}
            - name: BODY_LIMIT_MB
              value: {{ .Values.backend.bodyLimitMb | quote }}
            - name: FILE_UPLOAD_MAX_MB
              value: {{ .Values.backend.fileUploadMaxMb | quote }}
            {{- $publicUrl := include "excalidash.publicUrl" . }}
            {{- if $publicUrl }}
            - name: FRONTEND_URL
              value: {{ $publicUrl | quote }}
            {{- end }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "excalidash.secretName" . }}
                  key: {{ .Values.backend.secretKeys.jwt }}
            - name: CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "excalidash.secretName" . }}
                  key: {{ .Values.backend.secretKeys.csrf }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/prisma
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
            {{- with .Values.backend.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.backend.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: {{ .Values.backend.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.backend.startupProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.backend.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.backend.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.livenessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "excalidash.persistenceClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: uploads
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- with .Values.backend.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
