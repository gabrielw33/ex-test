{{- if not .Values.backend.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "excalidash.secretName" .) }}
{{- $jwt := .Values.backend.secrets.jwt }}
{{- $csrf := .Values.backend.secrets.csrf }}
{{- if and (not $jwt) $existing }}
{{- $jwt = (index $existing.data .Values.backend.secretKeys.jwt | b64dec) }}
{{- end }}
{{- if and (not $csrf) $existing }}
{{- $csrf = (index $existing.data .Values.backend.secretKeys.csrf | b64dec) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "excalidash.secretName" . }}
  labels:
    {{- include "excalidash.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.backend.secretKeys.jwt }}: {{ default (randAlphaNum 64) $jwt | quote }}
  {{ .Values.backend.secretKeys.csrf }}: {{ default (randAlphaNum 64) $csrf | quote }}
{{- end }}
