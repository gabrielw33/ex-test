{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "excalidash.fullname" . }}-frontend
  labels:
    {{- include "excalidash.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "excalidash.componentLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingressPodSelector | nindent 12 }}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "excalidash.componentLabels" (dict "root" . "component" "backend") | nindent 14 }}
      ports:
        - port: 8000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "excalidash.fullname" . }}-backend
  labels:
    {{- include "excalidash.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "excalidash.componentLabels" (dict "root" . "component" "backend") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "excalidash.componentLabels" (dict "root" . "component" "frontend") | nindent 14 }}
      ports:
        - port: 8000
          protocol: TCP
  # Authentication providers, SMTP, S3, and DNS may be external. Restrict this
  # in an environment-specific overlay when their destinations are known.
  egress:
    - {}
{{- end }}
